<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Gilson Lourenço — Backend, IoT, Data and Infrastructure</title>
  <desc id="desc">A blue and cyan editorial banner showing a connected path from sensor to dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.56" stop-color="#F5F7FB"/>
      <stop offset="1" stop-color="#EAF7FC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087BCB"/>
      <stop offset="1" stop-color="#19A7CE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55D5E8" stop-opacity=".46"/>
      <stop offset="1" stop-color="#55D5E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#17304D" flood-opacity=".12"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17304D" flood-opacity=".10"/>
    </filter>
    <clipPath id="round">
      <rect width="1200" height="420" rx="34"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <circle cx="1060" cy="52" r="245" fill="url(#glow)"/>
    <circle cx="1122" cy="362" r="190" fill="#087BCB" opacity=".05"/>
    <path d="M0 350 C265 285 410 445 690 350 S1010 245 1200 305" fill="none" stroke="#087BCB" stroke-opacity=".07" stroke-width="2"/>
    <path d="M0 374 C265 309 410 469 690 374 S1010 269 1200 329" fill="none" stroke="#19A7CE" stroke-opacity=".08" stroke-width="2"/>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
      <g transform="translate(64 58)">
        <rect width="160" height="34" rx="17" fill="#FFFFFF" fill-opacity=".76" stroke="#087BCB" stroke-opacity=".16"/>
        <circle cx="20" cy="17" r="5" fill="#19A7CE"/>
        <text x="35" y="22" font-size="12" font-weight="700" letter-spacing="1.5" fill="#087BCB">PORTFOLIO / 2026</text>
      </g>

      <text x="64" y="164" font-size="56" font-weight="760" letter-spacing="-2.2" fill="#101828">Gilson Lourenço</text>
      <text x="64" y="211" font-size="24" font-weight="600" letter-spacing="-.45" fill="#087BCB">Backend · IoT · Data · Infrastructure</text>
      <text x="64" y="269" font-size="19" font-weight="450" fill="#475467">I build connected systems from the sensor</text>
      <text x="64" y="298" font-size="19" font-weight="450" fill="#475467">to the backend, data, and final experience.</text>

      <g transform="translate(64 339)">
        <circle cx="7" cy="7" r="7" fill="#12B76A" opacity=".15"/>
        <circle cx="7" cy="7" r="3.5" fill="#12B76A"/>
        <text x="23" y="12" font-size="13" font-weight="600" letter-spacing=".25" fill="#344054">Open to internships, junior roles, and freelance projects</text>
      </g>

      <g transform="translate(760 62)" filter="url(#shadow)">
        <rect width="350" height="294" rx="28" fill="#FFFFFF" fill-opacity=".72" stroke="#FFFFFF" stroke-opacity=".95"/>
        <rect x=".5" y=".5" width="349" height="293" rx="27.5" fill="none" stroke="#087BCB" stroke-opacity=".09"/>
        <text x="30" y="42" font-size="12" font-weight="700" letter-spacing="1.7" fill="#667085">CONNECTED SYSTEM</text>

        <path d="M63 93 V229" stroke="#087BCB" stroke-opacity=".18" stroke-width="2"/>
        <path d="M63 93 C122 93 120 93 156 93" stroke="#087BCB" stroke-opacity=".18" stroke-width="2"/>
        <path d="M63 138 C122 138 120 138 156 138" stroke="#087BCB" stroke-opacity=".18" stroke-width="2"/>
        <path d="M63 183 C122 183 120 183 156 183" stroke="#087BCB" stroke-opacity=".18" stroke-width="2"/>
        <path d="M63 228 C122 228 120 228 156 228" stroke="#087BCB" stroke-opacity=".18" stroke-width="2"/>

        <g filter="url(#softShadow)">
          <circle cx="63" cy="93" r="17" fill="url(#accent)"/>
          <circle cx="63" cy="138" r="17" fill="url(#accent)"/>
          <circle cx="63" cy="183" r="17" fill="url(#accent)"/>
          <circle cx="63" cy="228" r="17" fill="url(#accent)"/>
        </g>
        <g font-size="10" font-weight="800" text-anchor="middle" fill="#FFFFFF">
          <text x="63" y="97">01</text><text x="63" y="142">02</text><text x="63" y="187">03</text><text x="63" y="232">04</text>
        </g>

        <g font-size="12" fill="#667085">
          <g transform="translate(156 73)">
            <rect width="154" height="39" rx="13" fill="#F8FAFC" stroke="#101828" stroke-opacity=".07"/>
            <text x="16" y="25" font-weight="700" fill="#101828">SENSOR</text><text x="86" y="25">ESP32</text>
          </g>
          <g transform="translate(156 118)">
            <rect width="154" height="39" rx="13" fill="#F8FAFC" stroke="#101828" stroke-opacity=".07"/>
            <text x="16" y="25" font-weight="700" fill="#101828">API</text><text x="86" y="25">FastAPI</text>
          </g>
          <g transform="translate(156 163)">
            <rect width="154" height="39" rx="13" fill="#F8FAFC" stroke="#101828" stroke-opacity=".07"/>
            <text x="16" y="25" font-weight="700" fill="#101828">DATA</text><text x="86" y="25">PostgreSQL</text>
          </g>
          <g transform="translate(156 208)">
            <rect width="154" height="39" rx="13" fill="#F8FAFC" stroke="#101828" stroke-opacity=".07"/>
            <text x="16" y="25" font-weight="700" fill="#101828">UI</text><text x="86" y="25">Web</text>
          </g>
        </g>
      </g>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="418.5" rx="33.25" fill="none" stroke="#101828" stroke-opacity=".08" stroke-width="1.5"/>
</svg>